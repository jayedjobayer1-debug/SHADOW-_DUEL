<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Shadow Duel</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020713;color:white;font-family:system-ui,Arial;touch-action:manipulation}button{color:white;background:#06152be8;border:1px solid #13baff;border-radius:10px;padding:9px;font-weight:800}.screen{display:none;position:absolute;inset:0}.active{display:block}.bg{position:absolute;inset:0;background-size:cover;background-position:center}.shade{position:absolute;inset:0;background:linear-gradient(90deg,#020714bb,#02071422,#020714bb),linear-gradient(0deg,#020713dd,transparent 45%)}.top{position:absolute;top:2%;left:2%;right:2%;display:flex;justify-content:space-between;align-items:center;gap:8px}.panel{background:#061124d9;border:1px solid #168dca;border-radius:10px;padding:9px;backdrop-filter:blur(5px)}.brand{font-size:clamp(20px,4vw,44px);font-weight:1000;font-style:italic;text-shadow:0 0 15px #08baff}.brand span{color:#ff294e}.grid{position:absolute;top:16%;bottom:14%;left:2%;right:2%;display:grid;grid-template-columns:minmax(100px,18%) 1fr minmax(130px,21%);gap:1%}.nav{display:flex;flex-direction:column;justify-content:center;gap:7px}.nav button{text-align:left;font-size:clamp(9px,1.5vw,16px)}.hero{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;padding-bottom:3%}.ninja{font-size:clamp(75px,15vw,170px);filter:drop-shadow(0 0 18px #ff174f);animation:idle 2s infinite}.title{font-size:clamp(18px,3vw,38px);font-weight:1000;text-shadow:0 0 18px #00bfff}.start{position:absolute;right:2%;bottom:3%;background:linear-gradient(120deg,#fff18b,#ffb800);color:#201600;border:2px solid #fff1a3;font-size:clamp(18px,3.5vw,38px);padding:10px 24px}.bottom{position:absolute;bottom:2%;left:2%;font-size:clamp(9px,1.3vw,14px)}.hud{position:absolute;top:2%;left:2%;right:2%;display:flex;justify-content:space-between;font-weight:bold}.hp{width:30vw;max-width:380px;background:#222;height:12px;border:1px solid #5de0ff}.fill{height:100%;width:100%;background:linear-gradient(90deg,#00d6ff,#1767ff)}.enemy .fill{background:linear-gradient(90deg,#ff4566,#aa0030)}.arena{position:absolute;top:23%;bottom:20%;left:0;right:0;display:flex;justify-content:space-evenly;align-items:center}.fighter{font-size:clamp(70px,14vw,150px);filter:drop-shadow(0 0 15px #00bfff);animation:idle 1.8s infinite}.enemyfighter{filter:drop-shadow(0 0 15px #ff174f);transform:scaleX(-1)}.controls{position:absolute;bottom:3%;left:2%;right:2%;display:flex;justify-content:space-between;align-items:end}.pad{width:clamp(65px,12vw,120px);height:clamp(65px,12vw,120px);border-radius:50%;font-size:24px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.actions button{font-size:clamp(9px,1.4vw,14px);padding:10px 6px;border-color:#ff4566}@keyframes idle{50%{transform:translateY(-8px)}}@media(max-height:420px){.grid{top:17%;bottom:15%}.nav button{padding:5px}.panel{padding:5px}}
</style></head><body>
<section id="lobby" class="screen active"><div class="bg" style="background-image:url('lobby-bg.png')"></div><div class="shade"></div>
<div class="top"><div class="panel">🥷 Rin_Official · Lv. 5<br><small>245 / 600 XP</small></div><div class="panel">🟡 2,350　💎 120</div><div class="brand">SHADOW <span>DUEL</span></div><button id="music">♫ MUSIC OFF</button></div>
<div class="grid"><div class="nav"><button>🎁 DAILY REWARDS</button><button>🛒 SHOP</button><button>🥷 CHARACTER</button><button>⚔ WEAPONS</button><button>⬆ UPGRADE</button><button>🔥 SKILLS</button><button>📜 MISSION</button></div><div class="hero"><div class="title">DARK NINJA VILLAGE</div><div class="ninja">🥷</div><div>CHAPTER 1 · THE SHADOW AWAKENS</div></div><div class="nav"><div class="panel"><b>NEW SKIN</b><br>Shadow Assassin</div><div class="panel"><b>GAME MODE</b><br>🌙 Story Mode<br>⚔ PvP Arena<br>☠ Survival</div><div class="panel"><b>MISSION</b><br>Defeat the village guardian</div></div></div>
<div class="bottom panel">🎵 <span id="musicText">Nightfall ambient ready</span></div><button class="start" id="start">START ➜</button></section>
<section id="fight" class="screen"><div class="bg" style="background-image:url('fight-bg.png')"></div><div class="shade"></div><div class="hud"><div>RIN · Lv. 5<div class="hp"><div id="php" class="fill"></div></div></div><div id="timer" style="font-size:clamp(22px,4vw,44px)">99</div><div class="enemy" style="text-align:right">VEX · Lv. 5<div class="hp"><div id="ehp" class="fill"></div></div></div></div><div class="arena"><div class="fighter">🥷</div><div class="fighter enemyfighter">🥷</div></div><div id="status" style="position:absolute;top:45%;width:100%;text-align:center;font-size:clamp(20px,4vw,42px);font-weight:1000">FIGHT!</div><div class="controls"><button class="pad" id="move">✥</button><div class="actions"><button data-hit="PUNCH">👊 PUNCH</button><button data-hit="KICK">🦵 KICK</button><button data-hit="BLOCK">🛡 BLOCK</button><button data-hit="SPECIAL">⚡ SPECIAL</button><button data-hit="JUMP">⬆ JUMP</button><button id="back">LOBBY</button></div></div></section>
<script>
const $=x=>document.getElementById(x);let ac=null,on=false,tick=null,t=99,eh=100,ph=100;
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active')}
$('start').onclick=()=>{show('fight');t=99;eh=ph=100;$('ehp').style.width='100%';$('php').style.width='100%';$('timer').textContent=t;$('status').textContent='FIGHT!';clearInterval(tick);tick=setInterval(()=>{if(t>0){$('timer').textContent=--t}else{clearInterval(tick);$('status').textContent='ROUND OVER'}},1000)};
$('back').onclick=()=>{clearInterval(tick);show('lobby')};$('move').onclick=()=>{$('status').textContent='MOVE!'};
document.querySelectorAll('[data-hit]').forEach(b=>b.onclick=()=>{let a=b.dataset.hit;$('status').textContent=a+'!';if(a==='PUNCH'||a==='KICK'||a==='SPECIAL'){eh=Math.max(0,eh-(a==='SPECIAL'?22:a==='KICK'?12:8));$('ehp').style.width=eh+'%';if(eh===0){$('status').textContent='RIN WINS!';clearInterval(tick)}}});
function music(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();let master=ac.createGain();master.gain.value=.025;master.connect(ac.destination);[110,164.8,220].forEach((f,i)=>{let o=ac.createOscillator(),g=ac.createGain();o.type=i?'sine':'triangle';o.frequency.value=f;g.gain.value=i?.2:.4;o.connect(g);g.connect(master);o.start()});on=true;$('music').textContent='♫ MUSIC ON';$('musicText').textContent='Playing ambient shadow beat'}catch(e){$('musicText').textContent='Audio unavailable'}}
$('music').onclick=()=>{if(!on)music();else{ac.suspend();on=false;$('music').textContent='♫ MUSIC OFF';$('musicText').textContent='Music paused'}};
</script></body></html>
